<!doctype html>
<!-- The one HTML page. React draws everything inside <div id="root">. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The app has its own light and dark themes, so the browser must not repaint it
         (Brave and Chrome "dark mode for web pages" darkened the light theme and hid the photo). -->
    <meta name="color-scheme" content="light dark">
    <title>Depot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
